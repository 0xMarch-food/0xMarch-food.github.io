<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 352 372" width="680" height="720" color="#243244" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="-6" y="-6" width="352" height="372" rx="5" fill="#fff"/>
    
